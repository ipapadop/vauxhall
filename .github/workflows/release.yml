name: Release

# Pushing a version tag, such as v0.1.0, runs every check, builds the wheel and
# sdist once, and attaches them to a GitHub release. See docs/releasing.md.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check the tag and changelog
        id: notes
        run: >-
          uv run --locked --no-dev python scripts/release_notes.py
          "$GITHUB_REF_NAME" --output notes.md
      # uv builds the sdist, then the wheel from that sdist, each in a fresh
      # isolated build environment. Timestamps come from the tagged commit, so
      # rebuilding the same tag gives the same archive contents.
      - name: Build wheel and sdist
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          uv build --out-dir dist
      - name: Check distribution metadata
        run: uv run --locked --only-group test twine check --strict dist/*
      - name: Smoke-test the built wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv venv smoke
          uv pip install --python smoke "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/vauxhall-hook-install --help
          smoke/bin/python -c "
          import sys
          from importlib.metadata import version
          import vauxhall.hooks.client
          assert 'v' + version('vauxhall') == sys.argv[1], sys.argv[1]
          " "$GITHUB_REF_NAME"
      - name: Record checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # The release is created as a draft, given every file, and only then
      # published, so with immutable releases enabled its files can't change.
      # A draft left by a failed run is reused, so re-running this job works;
      # a published release makes the create fail rather than change.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          title="Vauxhall ${GITHUB_REF_NAME#v}"
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft \
            --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" release/dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/dist/* \
              --draft --verify-tag --title "$title" \
              --notes-file release/notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --title "$title" \
            --notes-file release/notes.md --prerelease="$PRERELEASE" \
            --draft=false
