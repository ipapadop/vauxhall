name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The release workflow runs the same checks before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A literal prefix, because a called workflow sees the caller's name.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Test frontend
        run: |
          npm ci
          npm test
      # The gate covers vauxhall/dashboard/ui/js only. app.js is exercised by
      # the dashboard boot tests, but each test imports it under a fresh URL to
      # re-run its top-level setup, and V8 reports those instances separately,
      # so its measured coverage is not a number worth gating on.
      - name: Check frontend coverage
        run: npm run test:coverage

  test:
    # Every supported Python on Linux, and the newest supported one on the
    # other two desktop operating systems.
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OS dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Test with pytest
        run: uv run --locked pytest

  coverage:
    # The coverage floor is checked once, on one interpreter, because the
    # matrix above already proves the suite passes everywhere.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Check Python coverage
        run: uv run --locked pytest --cov

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - name: Build wheel and sdist
        run: uv build
      - name: Check distribution metadata
        run: uv run --locked --only-group test twine check --strict dist/*
      - name: Smoke-test the built wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv venv smoke
          uv pip install --python smoke "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/python -c "
          from importlib.resources import files
          import vauxhall.hooks.client, vauxhall.hooks.codex.telemetry_hook
          ui = files('vauxhall.dashboard') / 'ui'
          for asset in ('index.html', 'app.js', 'style.css', 'js/ui.js'):
              assert (ui / asset).is_file(), asset
          "

  sdist:
    # The sdist is a complete source artifact, so both test suites must pass
    # from it alone, outside any Git checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Build and unpack the sdist
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/dist"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP"
      - name: Test from the sdist
        working-directory: ${{ runner.temp }}
        run: |
          cd vauxhall-*/
          uv run --locked pytest
          npm ci
          npm test

  packaged-dashboard:
    # Install the built wheel outside the checkout and start the dashboard it
    # contains, on every desktop operating system Vauxhall claims to support.
    name: packaged dashboard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest because the Qt library names below
        # are release-specific.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - name: Install OS dependencies
        if: runner.os == 'Linux'
        # QtWebEngine links against these; without a display it still needs
        # EGL, GBM, NSS, and ALSA present.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libdbus-1-3 \
            libegl1 \
            libgbm1 \
            libgl1 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxi6 \
            libxkbcommon0 \
            libxkbfile1 \
            libxrandr2 \
            libxshmfence1 \
            libxtst6
      - name: Start the packaged dashboard
        run: uv run --locked pytest -m packaged
