<h2>Navigation: Copy to Clipboard</h2>
<p class="subtitle">Quickly jump to any workspace</p>

<div class="mockup">
  <div class="mockup-header">Agent Card - Navigation</div>
  <div class="mockup-body" style="padding: 20px;">
    <div style="background: #f8f9fa; border: 1px solid #dee2e6; padding: 12px; border-radius: 4px; cursor: pointer;" onclick="showToast()">
      <div style="display: flex; justify-content: space-between;">
        <b>Gemini @ /work/vauxhall</b>
        <span id="nav-status" style="color: #2196f3; font-size: 0.75em; font-weight: bold;">CLICK TO COPY CD</span>
      </div>
      <div style="font-family: monospace; font-size: 0.8em; background: #eee; padding: 8px; margin-top: 10px; border-radius: 4px; border: 1px dashed #ccc;">
        cd /home/user/workspace/github/vauxhall
      </div>
    </div>
  </div>
</div>

<div id="toast" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.8em; z-index: 1000;">
  Copied to clipboard!
</div>

<script>
function showToast() {
  const toast = document.getElementById('toast');
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2000);
}
</script>
