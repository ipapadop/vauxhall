[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vauxhall"
version = "0.1.0"
description = "Vauxhall Agent Dashboard & Hooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yiannis Papadopoulos", email = "2738325+ipapadop@users.noreply.github.com"},
]
maintainers = [
    {name = "Yiannis Papadopoulos", email = "2738325+ipapadop@users.noreply.github.com"},
]
keywords = ["ai-agents", "dashboard", "hooks", "monitoring", "mqtt", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "paho-mqtt>=2.0.0",
]

[project.urls]
Repository = "https://github.com/ipapadop/vauxhall"
Documentation = "https://github.com/ipapadop/vauxhall#readme"
Issues = "https://github.com/ipapadop/vauxhall/issues"
Changelog = "https://github.com/ipapadop/vauxhall/releases"
Security = "https://github.com/ipapadop/vauxhall/security/advisories"

[project.scripts]
vauxhall = "vauxhall.dashboard.app:main"
vauxhall-install-codex = "vauxhall.hooks.codex.install:install"
vauxhall-install-gemini = "vauxhall.hooks.gemini.install:install"

[project.optional-dependencies]
dashboard = [
    "pyperclip>=1.8.2",
    "pyloid>=0.1.0",
]
hooks = []

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    "vauxhall[dashboard]",
]
lint = [
    "ruff==0.16.6",
]
test = [
    "build>=1.2.2",
    "pytest>=9.0.1",
    "setuptools>=77.0.0",
    "twine>=6.2.0",
    "wheel>=0.45.1",
]

[tool.uv]
package = true

[tool.setuptools.package-data]
"vauxhall.dashboard" = ["ui/*", "ui/js/*"]

[tool.setuptools.packages.find]
include = ["vauxhall*"]

[tool.ruff]
line-length = 88
target-version = "py310"
required-version = "==0.16.6"
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["ALL",]
ignore = [
    "ANN002",   # no type annotation for *args
    "ANN003",   # no type annotation for **kwargs
    "ARG002",   # unused arguments
    "BLE001",   # catch blind exception
    "COM812",   # interferes with formatter
    "D100",     # missing docstring in public module
    "D104",     # missing docstring in public package
    "ERA001",   # remove commented out code
    "INP001",   # implicit namespace package
    "PLR0912",  # too many branches
    "PLR2004",  # magic numbers
    "LOG015",   # logging on root logger
    "S101",     # assert used
    "S110",     # exception logging
    "S311",     # weak random number generator
    "S603",     # check for execution of untrusted input
    "SLF001",   # private member accessed
    "T201",     # using print
    "TRY401",   # allow exception message
]
extend-select = ["I"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)SPDX-FileCopyrightText: \\d{4}"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
