<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vauxhall Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="https://github.com/ipapadop/vauxhall" id="logo-link" target="_blank" title="View on GitHub">
                    <img src="logo.svg" alt="Vauxhall Logo" style="height: 40px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));">
                </a>
                <div>
                    <h1>Vauxhall Agent Dashboard</h1>
                    <p id="js-status" role="status" aria-live="polite">Connecting...</p>
                </div>
            </div>
            <div class="toolbar">
                <button id="settings-btn" class="secondary-btn" title="Settings" aria-label="Settings" aria-haspopup="dialog">⚙️</button>
                <button id="theme-toggle" class="secondary-btn" title="Toggle Light/Dark Theme" aria-label="Toggle light and dark theme">🌓</button>
                <input type="text" id="search-input" placeholder="Search agents or paths..." class="search-bar" title="Filter agents by name or workspace path" aria-label="Filter agents by name or workspace path">
                <select id="sort-select" class="secondary-btn" title="Sort agent cards" aria-label="Sort agent cards">
                    <option value="name" selected>Agent Name</option>
                    <option value="recent">Recently Active</option>
                    <option value="status">Status</option>
                    <option value="tokens">Latest Tokens</option>
                </select>
                <button id="clear-stale-btn" class="secondary-btn" title="Remove inactive (stale) agents from the dashboard">Clear Stale</button>
                <button id="clear-btn" class="secondary-btn" title="Remove all agents from the dashboard">Clear Dashboard</button>
            </div>
        </div>
    </header>
    <main id="agent-grid" aria-label="Agent cards" tabindex="-1">
        <!-- Agent cards will be injected here -->
    </main>

    <dialog id="history-modal" class="modal" aria-labelledby="modal-agent-name">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; flex-direction: column; gap: 5px; flex: 1;">
                    <h2 id="modal-agent-name">Agent History</h2>
                    <div class="modal-toolbar" style="display: flex; gap: 10px;">
                        <input type="text" id="modal-search" placeholder="Filter history logs..." class="search-bar" style="flex: 1; min-width: 0;" aria-label="Filter history entries">
                        <select id="modal-state-filter" class="secondary-btn" aria-label="Filter history by state">
                            <option value="ALL">All States</option>
                            <option value="Acting">Acting</option>
                            <option value="Thinking">Thinking</option>
                            <option value="Waiting for Input">Waiting</option>
                            <option value="Error">Error</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="close-btn" title="Close history" aria-label="Close history">&times;</button>
            </div>
            <div id="modal-history-body" class="modal-body" tabindex="0" role="log" aria-label="History entries">
                <!-- Timeline items will be injected here -->
            </div>
        </div>
    </dialog>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
        <form id="settings-form" novalidate>
            <h2 id="settings-title">Settings</h2>
            <p id="settings-message" class="settings-message" role="status" aria-live="polite"></p>
            <div id="settings-fields"></div>
            <div id="settings-hooks" class="settings-hooks" hidden>
                <label>
                    <input type="checkbox" id="settings-update-hooks">
                    Also update hooks configuration (<code id="settings-hooks-path"></code>)
                </label>
                <p class="settings-note">
                    Hooks are not affected if they get <code>VAUXHALL_MQTT_*</code> environment
                    variables, run in a workspace with its own <code>vauxhall_hooks.json</code>,
                    or run on another machine.
                </p>
            </div>
            <div class="settings-actions">
                <button type="button" id="settings-cancel" class="secondary-btn">Cancel</button>
                <button type="submit" id="settings-save" class="secondary-btn primary-btn">Save</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="app.js"></script>
</body>
</html>
