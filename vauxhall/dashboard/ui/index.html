<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vauxhall Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
                <h1>Vauxhall Agent Dashboard</h1>
                <p id="js-status">Connecting...</p>
            </div>
            <div class="toolbar">
                <button id="theme-toggle" class="secondary-btn" title="Toggle Light/Dark Theme">🌓</button>
                <input type="text" id="search-input" placeholder="Search agents or paths..." class="search-bar" title="Filter agents by name or workspace path">
                <select id="sort-select" class="secondary-btn" title="Sort agent cards">
                    <option value="name" selected>Agent Name</option>
                    <option value="recent">Recently Active</option>
                    <option value="status">Status</option>
                    <option value="tokens">Total Tokens</option>
                </select>
                <button id="clear-stale-btn" class="secondary-btn" title="Remove inactive (stale) agents from the dashboard">Clear Stale</button>
                <button id="clear-btn" class="secondary-btn" title="Remove all agents from the dashboard">Clear Dashboard</button>
            </div>
        </div>
    </header>
    <main id="agent-grid">
        <!-- Agent cards will be injected here -->
    </main>

    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-agent-name">Agent History</h2>
                <span class="close-btn" title="Close history">&times;</span>
            </div>
            <div id="modal-history-body" class="modal-body">
                <!-- Timeline items will be injected here -->
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
