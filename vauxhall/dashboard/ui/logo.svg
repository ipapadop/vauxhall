<svg width="100" height="80" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <!-- Vauxhall Cross (MI6 HQ) Stylized Silhouette -->
    <defs>
        <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2ea043;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#238636;stop-opacity:1" />
        </linearGradient>
        <clipPath id="buildingClip">
            <rect x="10" y="60" width="80" height="15" /> <!-- Base -->
            <rect x="20" y="45" width="60" height="15" /> <!-- Tier 1 -->
            <rect x="30" y="30" width="40" height="15" /> <!-- Tier 2 -->
            <rect x="40" y="15" width="20" height="15" /> <!-- Tower -->
        </clipPath>
    </defs>

    <!-- Shadow/Base -->
    <rect x="5" y="72" width="90" height="3" rx="1.5" fill="#30363d" opacity="0.5"/>

    <!-- Building Structure -->
    <!-- Base Tier -->
    <rect x="10" y="55" width="80" height="15" fill="#8b949e" rx="1"/>
    <rect x="15" y="58" width="70" height="10" fill="url(#glassGradient)" rx="0.5"/>

    <!-- Middle Tier 1 -->
    <rect x="20" y="40" width="60" height="15" fill="#c9d1d9" rx="1"/>
    <rect x="25" y="43" width="50" height="10" fill="url(#glassGradient)" rx="0.5"/>

    <!-- Middle Tier 2 -->
    <rect x="30" y="25" width="40" height="15" fill="#8b949e" rx="1"/>
    <rect x="35" y="28" width="30" height="10" fill="url(#glassGradient)" rx="0.5"/>

    <!-- Central Tower -->
    <rect x="42" y="10" width="16" height="15" fill="#c9d1d9" rx="1"/>
    <rect x="45" y="13" width="10" height="10" fill="url(#glassGradient)" rx="0.5"/>
    
    <!-- Detail Lines (Columns) -->
    <line x1="20" y1="40" x2="20" y2="70" stroke="#30363d" stroke-width="0.5"/>
    <line x1="80" y1="40" x2="80" y2="70" stroke="#30363d" stroke-width="0.5"/>
    <line x1="30" y1="25" x2="30" y2="55" stroke="#30363d" stroke-width="0.5"/>
    <line x1="70" y1="25" x2="70" y2="55" stroke="#30363d" stroke-width="0.5"/>
</svg>
